name: Feed

# Calendario do feed. O QUE sai e decidido no run_feed.py (22/09/2026):
#   sexta            -> card de pauta de parceiro (padrao Moviki)
#   vitrine com cota -> post do lojista (no maximo VITRINE_POR_SEMANA)
#   demais           -> peca pronta: Material de apoio do parceiro ou, com a
#                       fonte ligada, peca de criador autorizada e aprovada
# Aqui so define QUANDO roda.
#
# Horarios em UTC. Sao Paulo = UTC-3.
#
# MINUTO QUEBRADO DE PROPOSITO (:37, :23, :47). O agendador do Actions e
# best-effort e enfileira: o minuto 0 de cada hora e o pico mundial, e foi
# o que fez os posts sairem com 1h a 10h de atraso (o de quinta 27/08 22h
# UTC so rodou sexta 06h). Minuto fora do pico entra numa fila muito menor.
# Publicar 23 min antes do alvo compensa a espera aleatoria do passo abaixo.
on:
  schedule:
    - cron: '37 12 * * 1,3'   # ~10h BRT — segunda e quarta
    - cron: '23 21 * * 2,4'   # ~19h BRT — terca e quinta
    - cron: '47 14 * * 5'     # ~12h BRT — sexta
  workflow_dispatch:
    inputs:
      tipo:
        description: 'material | criador | vitrine | institucional | (vazio = decide sozinho)'
        required: false
        default: ''
      dry_run:
        description: 'monta e NAO publica'
        type: boolean
        default: false

permissions:
  contents: write

# Nunca dois workflows mexendo em estado/ ao mesmo tempo.
concurrency:
  group: moviki-assistente-social-estado
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Publicar sempre no mesmo minuto cheio e padrao de robo. A espera
      # aleatoria deixa o horario organico. Reduzida de 25 para 12 min: o
      # atraso da fila do Actions ja da irregularidade de sobra, e 25 min
      # somados ao atraso jogavam o post pra longe demais do alvo.
      - name: Espera aleatoria (0-12 min)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 720 ))

      - name: Publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SO_FACEBOOK: ${{ secrets.SO_FACEBOOK }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcionais (22/09/2026). Vazios = padrao do codigo.
          MATERIAL_EXCLUIR: ${{ secrets.MATERIAL_EXCLUIR }}
          # 23/09/2026: "1" libera pecas que vendem live (live aberta a todos). Sem ele, ficam de fora.
          LIVE_NA_PAGINA: ${{ secrets.LIVE_NA_PAGINA }}
          VITRINE_EXCLUIR: ${{ secrets.VITRINE_EXCLUIR }}
          VITRINE_POR_SEMANA: ${{ secrets.VITRINE_POR_SEMANA }}
          CRIADORES_URL: ${{ secrets.CRIADORES_URL }}
          CRIADORES_SECRET: ${{ secrets.CRIADORES_SECRET }}
          CRIADORES_PARTICIPACAO: ${{ secrets.CRIADORES_PARTICIPACAO }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python run_feed.py ${{ inputs.tipo }}

      # No teste (dry_run) a arte fica disponivel pra baixar na pagina da
      # execucao, em "Artifacts". E assim que se ve o post antes de ir ao ar.
      - name: Guardar previa da arte
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: previa-do-post
          path: /tmp/feed-*.jpg
          retention-days: 7

      - name: Salvar estado
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "moviki-assistente-social"
          git config user.email "bot@moviki.com.br"
          git add estado/ || true
          git diff --staged --quiet && echo "nada a commitar" && exit 0
          git commit -m "estado: feed $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push
