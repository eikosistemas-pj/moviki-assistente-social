name: Feed

# Calendario do feed. Ter/Qui puxam pauta de conversao, Sex puxa parceiro,
# Seg/Qua puxam educativo/bastidor — a escolha acontece dentro do run_feed.py
# (funcao montar_institucional), aqui so define QUANDO roda.
#
# Horarios em UTC. Sao Paulo = UTC-3.
#
# MINUTO QUEBRADO DE PROPOSITO (:37, :23, :47). O agendador do Actions e
# best-effort e enfileira: o minuto 0 de cada hora e o pico mundial, e foi
# o que fez os posts sairem com 1h a 10h de atraso (o de quinta 27/08 22h
# UTC so rodou sexta 06h). Minuto fora do pico entra numa fila muito menor.
# Publicar 23 min antes do alvo compensa a espera aleatoria do passo abaixo.
on:
  schedule:
    - cron: '37 12 * * 1,3'   # ~10h BRT — segunda e quarta
    - cron: '23 21 * * 2,4'   # ~19h BRT — terca e quinta
    - cron: '47 14 * * 5'     # ~12h BRT — sexta
  workflow_dispatch:
    inputs:
      tipo:
        description: 'vitrine | institucional | (vazio = decide sozinho)'
        required: false
        default: ''
      dry_run:
        description: 'monta e NAO publica'
        type: boolean
        default: false

permissions:
  contents: write

# Nunca dois workflows mexendo em estado/ ao mesmo tempo.
concurrency:
  group: moviki-assistente-social-estado
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Publicar sempre no mesmo minuto cheio e padrao de robo. A espera
      # aleatoria deixa o horario organico. Reduzida de 25 para 12 min: o
      # atraso da fila do Actions ja da irregularidade de sobra, e 25 min
      # somados ao atraso jogavam o post pra longe demais do alvo.
      - name: Espera aleatoria (0-12 min)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 720 ))

      - name: Publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SO_FACEBOOK: ${{ secrets.SO_FACEBOOK }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python run_feed.py ${{ inputs.tipo }}

      - name: Salvar estado
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "moviki-assistente-social"
          git config user.email "bot@moviki.com.br"
          git add estado/ || true
          git diff --staged --quiet && echo "nada a commitar" && exit 0
          git commit -m "estado: feed $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push
