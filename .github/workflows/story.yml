name: Story

# Story (22/09/2026; grade nova em 17/10/2026; ajuste de 23/10/2026).
# 4 por dia (era 5): corte de VIDEO e ARTE animada alternando, mais 1
# PERGUNTA DO DIA (resposta numa palavra no direct). No maximo 1 story por
# tema sazonal (Black Friday...) por dia. Nada antes das 7h BRT: o Actions
# atrasa a rodada da noite em ate 4 h e ela caia de madrugada (src/story.py).
#
# MINUTOS DO ACTIONS: este repositorio e PUBLICO, e repositorio publico nao
# gasta a cota mensal de minutos do plano gratuito. Cada rodada dura ~2 min.
on:
  schedule:
    # Horarios pelo GA4 (visitas vindas do Instagram, 30 dias ate 23/10/2026):
    # picos 12h-13h, 17h-19h e 22h-23h, e um repique as 7h. A ultima rodada
    # fica antes das 21h BRT (00h UTC), onde o Actions atrasa ate 4 h.
    - cron: '43 10 * * *'   # ~7h43 BRT
    - cron: '13 15 * * *'   # ~12h13 BRT
    - cron: '37 20 * * *'   # ~17h37 BRT (3a rodada = pergunta do dia)
    - cron: '41 23 * * *'   # ~20h41 BRT
  workflow_dispatch:
    inputs:
      origem:
        description: 'material | criador | (vazio = decide sozinho)'
        required: false
        default: ''
      dry_run:
        description: 'escolhe e NAO publica'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: moviki-assistente-social-estado
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Espera aleatoria (0-8 min)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 480 ))

      - name: Publicar Story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          SO_FACEBOOK: ${{ secrets.SO_FACEBOOK }}
          # 27/09/2026: Instagram formato a formato (feed | feed,reel | vazio = todos).
          IG_FORMATOS: ${{ secrets.IG_FORMATOS }}
          MATERIAL_EXCLUIR: ${{ secrets.MATERIAL_EXCLUIR }}
          # 23/09/2026: "1" libera pecas que vendem live (live aberta a todos). Sem ele, ficam de fora.
          LIVE_NA_PAGINA: ${{ secrets.LIVE_NA_PAGINA }}
          CRIADORES_URL: ${{ secrets.CRIADORES_URL }}
          CRIADORES_SECRET: ${{ secrets.CRIADORES_SECRET }}
          CRIADORES_PARTICIPACAO: ${{ secrets.CRIADORES_PARTICIPACAO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python run_story.py ${{ inputs.origem }}

      - name: Salvar estado
        if: ${{ !inputs.dry_run }}
        # 08/10/2026: merge a tres pontas em JSON, sem rebase (incidente Feed #44).
        run: |
          python salvar_estado.py "estado: story"

      # 27/09/2026. Se o Instagram falhou, o post saiu so na Pagina (plano B)
      # e o estado ja foi salvo acima. Este passo deixa o job VERMELHO para o
      # GitHub mandar e-mail — antes o plano B passava verde e o Instagram
      # podia ficar semanas fora do ar sem ninguem ver.
      - name: Alarme - Instagram falhou
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if [ -f /tmp/alerta-instagram.txt ]; then
            while read -r linha; do echo "::error::$linha"; done < /tmp/alerta-instagram.txt
            exit 1
          fi
          echo "Instagram sem falha neste ciclo."
