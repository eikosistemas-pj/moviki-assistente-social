name: Story

# Story (22/09/2026). 2 por dia: story some em 24 h, e quem entra no perfil
# sempre encontra a bolinha acesa. Fontes: stories do Material de apoio e,
# quando ligada, stories de criadores autorizados e aprovados.
#
# MINUTOS DO ACTIONS: este repositorio e PUBLICO, e repositorio publico nao
# gasta a cota mensal de minutos do plano gratuito. Mesmo assim, cada rodada
# dura ~1 min.
on:
  schedule:
    - cron: '17 12 * * *'   # ~9h BRT — todo dia (minuto fora do pico do Actions)
    - cron: '41 21 * * *'   # ~18h40 BRT — todo dia
  workflow_dispatch:
    inputs:
      origem:
        description: 'material | criador | (vazio = decide sozinho)'
        required: false
        default: ''
      dry_run:
        description: 'escolhe e NAO publica'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: moviki-assistente-social-estado
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Espera aleatoria (0-12 min)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 720 ))

      - name: Publicar Story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          SO_FACEBOOK: ${{ secrets.SO_FACEBOOK }}
          # 27/09/2026: Instagram formato a formato (feed | feed,reel | vazio = todos).
          IG_FORMATOS: ${{ secrets.IG_FORMATOS }}
          MATERIAL_EXCLUIR: ${{ secrets.MATERIAL_EXCLUIR }}
          # 23/09/2026: "1" libera pecas que vendem live (live aberta a todos). Sem ele, ficam de fora.
          LIVE_NA_PAGINA: ${{ secrets.LIVE_NA_PAGINA }}
          CRIADORES_URL: ${{ secrets.CRIADORES_URL }}
          CRIADORES_SECRET: ${{ secrets.CRIADORES_SECRET }}
          CRIADORES_PARTICIPACAO: ${{ secrets.CRIADORES_PARTICIPACAO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python run_story.py ${{ inputs.origem }}

      - name: Salvar estado
        if: ${{ !inputs.dry_run }}
        # 08/10/2026: merge a tres pontas em JSON, sem rebase (incidente Feed #44).
        run: |
          python salvar_estado.py "estado: story"

      # 27/09/2026. Se o Instagram falhou, o post saiu so na Pagina (plano B)
      # e o estado ja foi salvo acima. Este passo deixa o job VERMELHO para o
      # GitHub mandar e-mail — antes o plano B passava verde e o Instagram
      # podia ficar semanas fora do ar sem ninguem ver.
      - name: Alarme - Instagram falhou
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if [ -f /tmp/alerta-instagram.txt ]; then
            while read -r linha; do echo "::error::$linha"; done < /tmp/alerta-instagram.txt
            exit 1
          fi
          echo "Instagram sem falha neste ciclo."
